name: CI

# Runs on every push to main and on every pull request: lint, type-check, tests and a production build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Server starts and answers its health check
        run: |
          TH_DATA_DIR="$RUNNER_TEMP/th-data" PORT=8787 node server/index.mjs &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/healthz && exit 0
            sleep 1
          done
          echo "Server did not become healthy" && exit 1
